  <script>
    /* Tema antes del primer pintado: preferencia guardada → tema del anfitrión → sistema */
    (function () {
      var r = document.documentElement, s = null;
      try { s = localStorage.getItem("ch-theme"); } catch (e) {}
      var host = r.getAttribute("data-theme");
      var sys = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      r.dataset.theme = s === "light" || s === "dark" ? s : host === "light" || host === "dark" ? host : sys;
    })();
  </script>
